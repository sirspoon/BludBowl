<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full screen test</title>
<style>
  body { margin: 0; padding: 16px; background: #0f172a; color: #e2e8f0; font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: #94a3b8; }
  button { display: block; width: 100%; margin: 0 0 10px; padding: 14px; font-size: 16px; font-weight: 700; border-radius: 10px; border: 1px solid #f59e0b; background: #1e293b; color: #fff; }
  #out { white-space: pre-wrap; background: #020617; border: 1px solid #334155; border-radius: 10px; padding: 10px; font: 13px/1.4 ui-monospace, monospace; min-height: 8em; }
</style>
</head>
<body>
<h1>Full screen test</h1>
<p>A plain page with nothing from the game, to see whether Chrome goes full screen at all. Tap each button in turn (tap "Leave full screen" if one works), then send a screenshot of the box at the bottom.</p>
<button id="b1">1. Whole page</button>
<button id="b2">2. Whole page, hiding Chrome's bar</button>
<button id="b3">3. Just this box</button>
<button id="bx">Leave full screen</button>
<div id="box" style="background:#1e293b;border-radius:10px;padding:10px;margin-bottom:10px">A box to make full screen</div>
<div id="out"></div>
<script>
  const out = document.getElementById('out'), t0 = performance.now();
  const say = m => { out.textContent += m + '\n'; };
  say('Chrome: ' + ((navigator.userAgent.match(/Chrome\/[\d.]+/) || ['?'])[0]) + ' · Android ' + ((navigator.userAgent.match(/Android ([\d.]+)/) || [, '?'])[1]));
  say('fullscreenEnabled: ' + document.fullscreenEnabled + ' · focus: ' + document.hasFocus() + ' · page ' + innerWidth + 'x' + innerHeight + ', screen ' + screen.width + 'x' + screen.height);
  document.addEventListener('fullscreenchange', () => say('  (change: now ' + (document.fullscreenElement ? 'full screen' : 'not full screen') + ')'));
  document.addEventListener('fullscreenerror', () => say('  (fullscreenerror event)'));
  function go(n, el, opts) {
    const at = performance.now(); let done = false;
    say(n + ': asked…');
    let p; try { p = opts ? el.requestFullscreen(opts) : el.requestFullscreen(); } catch (e) { say(n + ': error straight away: ' + e.message); return; }
    Promise.resolve(p).then(() => { done = true; say(n + ': OK after ' + Math.round(performance.now() - at) + 'ms'); },
      e => { done = true; say(n + ': refused after ' + Math.round(performance.now() - at) + 'ms: ' + (e && e.message)); });
    setTimeout(() => { if (!done) say(n + ': no answer after 3s'); }, 3000);
  }
  document.getElementById('b1').onclick = () => go('1', document.documentElement);
  document.getElementById('b2').onclick = () => go('2', document.documentElement, { navigationUI: 'hide' });
  document.getElementById('b3').onclick = () => go('3', document.getElementById('box'));
  document.getElementById('bx').onclick = () => { if (document.fullscreenElement) document.exitFullscreen().then(() => say('left full screen'), e => say('leave failed: ' + e.message)); else say('(not full screen)'); };
</script>
</body>
</html>
